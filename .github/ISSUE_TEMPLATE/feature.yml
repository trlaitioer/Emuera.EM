name: feature request
description: 提出一个新功能或改进
labels: ["enhancement", "status:draft"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的效果
      description: 描述你希望能做什么，或期待引擎在什么情况下表现得不同
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 问题背景
      description: 遇到什么问题、为什么需要这个功能
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 实现建议
      description: 如果已有实现思路或考虑过其他方案，可以写在这里
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 参考实现、相关链接等
    validations:
      required: false
