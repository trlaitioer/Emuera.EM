name: Bug report
description: 报告一个 Emuera 引擎的问题
labels: ["bug", "status:draft"]
body:
  - type: markdown
    attributes:
      value: |
        请优先向游戏维护者报告问题，尽可能确保问题并非出自游戏脚本，而是 Emuera 引擎。尽量提供可复现步骤，提交前请先搜索有无相同 issue

  - type: textarea
    id: bug_description
    attributes:
      label: Bug 描述
      description: 发生了什么、影响范围
      placeholder: 例如：某脚本解析失败、执行失败；特定命令的结果不正确
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现方法
      description: 尽可能给出复现步骤，或给出可复现的脚本片段；如果无法复现，请说明
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该是什么表现
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 附加信息、材料
      description: 游戏及版本、Emuera 版本、Windows 版本、emuera.log 等
    validations:
      required: false
